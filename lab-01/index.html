<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Broken Light</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section id="splash" class="screen">
      <div class="bar"><div class="bar-fill"></div></div>
    </section>
      <main class="screen" hidden>
        <img src="assets/logo.svg" alt="The Broken Light" id="logo">
        <nav aria-label="Головне меню">
          <button class="btn" data-action="start">Start</button>
          <button class="btn" data-action="options">Options</button>
          <button class="btn" data-action="exit">Exit Game</button>
        </nav>
        <div class="credits">
          <p>Author: Forgotten, 2026</p>
          <p>Version 1.0.0</p>
        </div>
      </main>
    <script src="script.js"></script>
  </body>
</html>
